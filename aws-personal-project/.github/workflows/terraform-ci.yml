name: terraform-ci

# Static checks only. No AWS credentials are used, and nothing is deployed.
on:
  pull_request:
    paths:
      - "project-*/**"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "project-*/**"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.find.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Find every Terraform stack (project roots and bootstrap folders)
        run: |
          stacks=$(find . -path ./.git -prune -o -name versions.tf -print \
            | xargs -n1 dirname | sed 's#^\./##' | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "Found: $stacks"

  validate:
    needs: discover
    if: needs.discover.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.discover.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          config_file: .checkov.yaml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
